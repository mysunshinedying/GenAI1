<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>/exam09-fetch-form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white text-body">
    <main class="container-fluid p-3 p-md-4">
        <article class="card shadow-sm rounded-3 overflow-hidden" aria-labelledby="request-title">
            <header class="card-header bg-body-tertiary p-3 p-md-4">
                <h1 id="request-title" class="fs-6 fw-normal mb-0">/exam09-fetch-form</h1>
            </header>
            <div class="card-body p-3 p-md-4">
                <form id="boardForm" class="mt-3" novalidate>
                    <div class="mb-3">
                        <label for="bno" class="form-label">번호</label>
                        <input type="number" class="form-control" id="bno" name="bno" min="1" required>
                    </div>
                    <div class="mb-3">
                        <label for="title" class="form-label">제목</label>
                        <input type="text" class="form-control" id="title" name="title" maxlength="100" required>
                        <div class="invalid-feedback">제목은 2자 이상 입력해 주세요.</div>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">내용</label>
                        <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="writer" class="form-label">작성자</label>
                        <input type="text" class="form-control" id="writer" name="writer" maxlength="30" required>
                    </div>
                    <div class="mb-3">
                        <label for="attach" class="form-label">첨부파일</label>
                        <input type="file" class="form-control" id="attach" name="attach">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">제출</button>
                        <button type="reset" class="btn btn-secondary">취소</button>
                    </div>
                </form>
            </div>
        </article>
    </main>
    <script>
        const form = document.getElementById('boardForm');

        async function write() {
            const formData = new FormData();
            formData.append('bno', document.getElementById('bno').value);
            formData.append('title', document.getElementById('title').value);
            formData.append('content', document.getElementById('content').value);
            formData.append('writer', document.getElementById('writer').value);
            const file = document.getElementById('attach').files[0];
            if (file) {
                formData.append('attach', file);
            }


            try {
                const response = await fetch('/api/method7', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    throw new Error(`요청에 실패했습니다. (HTTP ${response.status})`);
                }
                const result = await response.json();
                console.log(result);
            } catch (error) {
                console.error('API 호출 오류:', error);
            }
        }

        function validateTitle() {
            const title = document.getElementById('title');
            const valid = title.value.trim().length >= 2;
            title.classList.toggle('is-invalid', !valid);
            if (!valid) {
                title.focus();
            }
            return valid;
        }

        document.getElementById('title').addEventListener('input', () => {
            document.getElementById('title').classList.remove('is-invalid');
        });

        form.addEventListener('submit', event => {
            event.preventDefault();
            if (!validateTitle()) {
                return;
            }
            write();
        });
    </script>
</body>
</html>
