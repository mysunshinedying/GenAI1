spring.application.name=javascript

# 濡쒓렇 ?덈꺼: TRACE -> DEBUG -> INFO -> WARN -> ERROR
logging.level.root=INFO
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%-5level){green} %clr(%logger){cyan}.%clr(%replace(%caller{1}){'(?s).*[.]([^.(]+)[(][^)]*[)].*', '$1()'}){magenta}: %clr(%msg){yellow}%n{}




