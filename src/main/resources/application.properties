## 프로젝트 이름
spring.application.name=back-end


## 서버 포트
server.port=80

## 터미널 칼라 출력
spring.output.ansi.enabled=ALWAYS

## 로깅
logging.pattern.console=%clr(%-5level){green} %clr(%logger{15}.%M\\(\\)){cyan}: %msg %n
logging.level.root=INFO

## 파일 업로드
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

## DataSource(database) 연결 설정
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/orcl}
# spring.datasource.username=${DB_USERNAME:oracle}
# spring.datasource.password=${DB_PASSWORD:oracle}

# MyBatis 설정
# 공통 설정 파일
mybatis.config-location=classpath:mybatis/mybatis_config.xml
# SQL 매퍼 위치
mybatis.mapper-locations=classpath:mybatis/mapper/*.xml

## OpenAI API Key
my_openai_api_key=${OPENAI_API_KEY}

#JWT를 위한 비밀키
jwt.secret.key=${JWT_SECRET_KEY}