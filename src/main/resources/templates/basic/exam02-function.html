<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>/exam02-function</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 응답 문자열의 줄바꿈 보존은 Bootstrap 유틸리티에 없습니다. */
        .response-content { white-space: pre-wrap; }
        /* Bootstrap 기본 색상에 없는 보라색 버튼 변형입니다. */
        .btn-purple {
            --bs-btn-color: #fff;
            --bs-btn-bg: #6f42c1;
            --bs-btn-border-color: #6f42c1;
            --bs-btn-hover-color: #fff;
            --bs-btn-hover-bg: #59359a;
            --bs-btn-hover-border-color: #59359a;
            --bs-btn-focus-shadow-rgb: 111, 66, 193;
            --bs-btn-active-color: #fff;
            --bs-btn-active-bg: #533291;
            --bs-btn-active-border-color: #533291;
            --bs-btn-disabled-color: #fff;
            --bs-btn-disabled-bg: #6f42c1;
            --bs-btn-disabled-border-color: #6f42c1;
        }
    </style>
    <script>
        // btn1 버튼을 클릭했을 때 실행하는 함수 정의
        function btn1Click() {
            console.log("btn1이 클릭되었습니다.");
        }

        // btn2 버튼을 클릭했을 때 실행하는 함수 정의
        const btn2Click = function() {
            console.log("btn2이 클릭되었습니다.");
        }

        //---------------------------------------------------------
        // HTML이 로딩이 끝나면(브라우저가 모두 읽었을 때) 자동으로 실행되는 함수
        document.addEventListener("DOMContentLoaded", function() {
            console.log("HTML이 로딩이 끝나면(브라우저가 모두 읽었을 때) 자동으로 실행");

            // id가 btn3인 엘리머트를 가져오기
            const btn3 = document.getElementById("btn3");
            // btn3에서 click 이벤트가 발생하면 function() 실행
            btn3.addEventListener("click", function() {
                console.log("btn3이 클릭되었습니다.");
            });

            // id가 btn4인 엘리머트를 가져오기
            const btn4 = document.getElementById("btn4");
            // btn4에서 click 이벤트가 발생하면 function() 실행
            btn4.onclick = function() {
                console.log("btn4이 클릭되었습니다.");
            }
        });

        //---------------------------------------------------------
        // Arrow Function(화살표 함수, 람다식)
        const btn5Click = () => {
            console.log("btn5가 클릭되었습니다.");
        };

        //---------------------------------------------------------
        function multiArgs(arg1, arg2=2, arg3=3) {
            const result = arg1 + arg2 + arg3;
            console.log("result: ", result);
        }
    </script>
</head>
<body class="bg-white text-body">
    <main class="container-fluid p-3 p-md-4">
        <article class="card shadow-sm rounded-3 overflow-hidden" aria-labelledby="request-title">
            <header class="card-header bg-body-tertiary p-3 p-md-4">
                <h1 id="request-title" class="fs-6 fw-normal mb-0">/exam02-function</h1>
            </header>
            <div class="card-body p-3 p-md-4">
                <p class="response-content text-break mb-0">함수 예제 페이지 요청이 정상적으로 처리되었습니다.</p>
                <button id="btn1" type="button" class="btn btn-primary mt-3" onclick="btn1Click()">버튼 1</button>
                <button id="btn2" type="button" class="btn btn-purple mt-3" onclick="btn2Click()">버튼 2</button>
                <button id="btn3" type="button" class="btn btn-purple mt-3">버튼 3</button>
                <button id="btn4" type="button" class="btn btn-purple mt-3">버튼 4</button>
                <button id="btn5" type="button" class="btn btn-purple mt-3" onclick="btn5Click()">버튼 5</button>
                <button id="btn6" type="button" class="btn btn-purple mt-3" onclick="multiArgs(10)">버튼 6</button>
                <button id="btn7" type="button" class="btn btn-purple mt-3" onclick="multiArgs(10, 20)">버튼 7</button>
                <button id="btn8" type="button" class="btn btn-purple mt-3" onclick="multiArgs(10, 20, 30)">버튼 8</button>
            </div>
        </article>
    </main>
</body>
</html>
