<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>/exam07-fetch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        async function btn1Click() {
            try {
                const params = new URLSearchParams({ param1: 'value1', param2: 'value2' });
                const response = await fetch(`/api/method1?${params}`, {
                    method: 'GET'
                });

                if (!response.ok) {
                    throw new Error(`요청에 실패했습니다. (HTTP ${response.status})`);
                }
                const result = await response.text();
                console.log(result);
            } catch (error) {
                console.error('API 호출 오류:', error);
            }
        }
        async function btn2Click() {
            try {
                const response = await fetch('/api/method2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ param1: 'value1', param2: 'value2' })
                });

                if (!response.ok) {
                    throw new Error(`요청에 실패했습니다. (HTTP ${response.status})`);
                }
                const result = await response.text();
                console.log(result);
            } catch (error) {
                console.error('API 호출 오류:', error);
            }
        }
        async function btn3Click() {
            try {
                const imageResponse = await fetch('/images/photo/photo1.jpg');
                const imageBlob = await imageResponse.blob();

                const formData = new FormData();
                formData.append('param1', 'value1');
                formData.append('param2', 'value2');
                formData.append('param3', imageBlob, 'photo1.jpg');

                const response = await fetch('/api/method3', {
                    method: 'PUT',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`요청에 실패했습니다. (HTTP ${response.status})`);
                }
                const result = await response.text();
                console.log(result);
            } catch (error) {
                console.error('API 호출 오류:', error);
            }
        }
        async function btn4Click() {
            try {
                const obj = { param1: 'value', param2: 30 };
                const json = JSON.stringify(obj);
                console.log(obj);
                console.log(json);

                const response = await fetch('/api/method4', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: json
                });

                if (!response.ok) {
                    throw new Error(`요청에 실패했습니다. (HTTP ${response.status})`);
                }
                const result = await response.text();
                console.log(result);
            } catch (error) {
                console.error('API 호출 오류:', error);
            }            

        }
    </script>
</head>

<body class="bg-white text-body">
    <main class="container-fluid p-3 p-md-4">
        <article class="card shadow-sm rounded-3 overflow-hidden" aria-labelledby="request-title">
            <header class="card-header bg-body-tertiary p-3 p-md-4">
                <h1 id="request-title" class="fs-6 fw-normal mb-0">/exam07-fetch</h1>
            </header>
            <div class="card-body p-3 p-md-4">
                <button class="btn btn-primary btn-small" id="fetch-button" onclick="btn1Click()">버튼1</button>
                <button class="btn btn-primary" id="fetch-button-2" onclick="btn2Click()">버튼2</button>
                <button class="btn btn-primary" id="fetch-button-3" onclick="btn3Click()">버튼3</button>
                <button class="btn btn-primary" id="fetch-button-4" onclick="btn4Click()">버튼4</button>
            </div>
        </article>
    </main>
</body>

</html>
