<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>/exam03-object</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 응답 문자열의 줄바꿈 보존은 Bootstrap 유틸리티에 없습니다. */
        .response-content { white-space: pre-wrap; }
    </style>
    <script>
        function btn1Click() {
            // JavaScript에서 객체를 생성
            var member = {mid: "hong", mname:"홍길동", mage: 25, adult: true};

            // 객체 속성값 읽기 
            console.log("member.mid: " + member.mid);
            console.log("member.mname: " + member.mname);
            console.log("member.mage: " + member.mage);
            console.log("member.adult: " + member.adult);
            console.log(member);

            // 객체 속성값 변경
            member.mid = "white";
            member.mname = '최하얀';
            member.mage = 12;
            member.adult = false;
            console.log(member);
        }
    </script>
</head>
<body class="bg-white text-body">
    <main class="container-fluid p-3 p-md-4">
        <article class="card shadow-sm rounded-3 overflow-hidden" aria-labelledby="request-title">
            <header class="card-header bg-body-tertiary p-3 p-md-4">
                <h1 id="request-title" class="fs-6 fw-normal mb-0">/exam03-object</h1>
            </header>
            <div class="card-body p-3 p-md-4">
                <button class="btn btn-info btn-small" onclick="btn1Click()">버튼1</button>
            </div>
        </article>
    </main>
</body>
</html>
