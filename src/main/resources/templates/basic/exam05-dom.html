<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>/exam05-dom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-orange {
            background-color: orange;
        }
    </style>

    <script>
        const imgSrcLists = [
            '/images/photo/photo1.jpg',
            '/images/photo/photo2.jpg',
            '/images/photo/photo3.jpg',
            '/images/photo/photo4.jpg',
            '/images/photo/photo5.jpg',
            '/images/photo/photo6.jpg',
            '/images/photo/photo7.jpg',
            '/images/photo/photo8.jpg',
            '/images/photo/photo9.jpg',
            '/images/photo/photo10.jpg',
            '/images/photo/photo11.jpg',
            '/images/photo/photo12.jpg',
            '/images/photo/photo13.jpg',
            '/images/photo/photo14.jpg',
            '/images/photo/photo15.jpg',
            '/images/photo/photo16.jpg',
            '/images/photo/photo17.jpg',
        ];

        function btn1Click() {
            const img = document.getElementById('img1');
            const img1 = document.querySelector('#img1');
        }

        function btn2Click() {
            const imgGroup1 = document.getElementsByClassName('imgGroup1');
            const imgGroup2 = document.querySelectorAll('.imgGroup1');
        }

        function btn3Click() {
            const btitle = document.getElementsByName('btitle');
            const bcontent = document.getElementsByName('bcontent');
            console.log(btitle);
            console.log(bcontent);
        }

        function btn4Click() {
            const checkboxes = document.querySelectorAll('#chckBoxDiv input[type="checkbox"]:checked');
            checkboxes.forEach(checkbox => console.log(checkbox.value));
        }

        function btn5Click() {
            const img = document.getElementById('img2');
            img.src = '/images/photo/photo5.jpg';
        }
        function btn6Click() {
            const message = document.querySelector('#message1');
            message.value = '동적 삽입 글자';
        }
        function btn7Click() {
            const content1 = document.getElementById('content1');
            content1.classList.add('alert');
            content1.classList.add('alert-danger');
        }
        function btn99Click() {
            const img = document.getElementById('img2');
            const randomIndex = Math.floor(Math.random() * imgSrcLists.length);
            img.src = imgSrcLists[randomIndex];
        }
    </script>
</head>

<body class="bg-white text-body">
    <main class="container-fluid p-3 p-md-4">
        <article class="card shadow-sm rounded-3 overflow-hidden" aria-labelledby="request-title">
            <header class="card-header bg-body-tertiary p-3 p-md-4">
                <h1 id="request-title" class="fs-6 fw-normal mb-0">/exam05-dom</h1>
            </header>
            <div class="card-body p-3 p-md-4">
                <div id="div1">
                    <h4>객체 찾기</h4>
                    <button type="button" class="btn btn-info btn-sm" onclick="btn1Click()">id로 찾기</button>
                    <button type="button" class="btn btn-info btn-sm" onclick="btn2Click()">class로 찾기</button>
                    <button type="button" class="btn btn-info btn-sm" onclick="btn3Click()">name으로 찾기</button>
                    <button type="button" class="btn btn-info btn-sm" onclick="btn4Click()">선택한 checkbox만 찾기</button>
                    <hr />
                    <div>
                        <img id="img1" src="/images/photo/photo1.jpg" width="100" />
                        <img class="imgGroup1" src="/images/photo/photo2.jpg" width="100" />
                        <img class="imgGroup1" src="/images/photo/photo3.jpg" width="100" />
                        <div class="mt-2">
                            <input type="text" name="btitle" value="게시물 제목" />
                            <input type="text" name="bcontent" value="게시물 내용" />
                        </div>
                        <div id="chckBoxDiv">
                            <label><input type="checkbox" name="chk1" value="Reading" />독서</label>
                            <label><input type="checkbox" name="chk2" value="Exercise" />운동</label>
                            <label><input type="checkbox" name="chk3" value="Cooking" />요리</label>
                        </div>
                    </div>

                </div>
                <div id="div2" class="mt-3">
                    <h4>property value 변경</h4>
                    <button type="button" class="btn btn-info btn-sm" onclick="btn5Click()" id="btn5">이미지 변경</button>
                    <button type="button" class="btn btn-info btn-sm" onclick="btn6Click()" id="btn6">input value값
                        변경</button>
                    <button type="button" class="btn btn-info btn-sm" onclick="btn99Click()" id="btn99">이미지 랜덤
                        변경</button>
                    <div class="mt-2">
                        <img id="img2" src="/images/photo/photo4.jpg" width="100" />
                        <input type="text" id="message1" value="" />
                    </div>
                </div>
                <div id="div3" class="mt-3">
                    <h4>CSS 변경</h4>
                    <button type="button" class="btn btn-info btn-sm" onclick="btn7Click()" id="btn7">배경색 변경</button>
                    <div class="mt-2">
                        <div id="content1">본문내용</div>
                    </div>
                </div>
            </div>
        </article>
    </main>
</body>

</html>
