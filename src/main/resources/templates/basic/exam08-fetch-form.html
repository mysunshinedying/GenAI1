<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>/exam08-fetch-form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white text-body">
    <main class="container-fluid p-3 p-md-4">
        <article class="card shadow-sm rounded-3 overflow-hidden" aria-labelledby="request-title">
            <header class="card-header bg-body-tertiary p-3 p-md-4">
                <h1 id="request-title" class="fs-6 fw-normal mb-0">/exam08-fetch-form</h1>
            </header>
            <div class="card-body p-3 p-md-4">
                <p class="mb-0">회원 가입 양식</p>
                <form id="signupForm" class="mt-3" novalidate>
                    <div class="mb-3">
                        <label for="userId" class="form-label">아이디</label>
                        <input type="text" class="form-control" id="userId" name="userId" autocomplete="username" value="user1" required>
                        <div class="form-text">영문자로 시작하는 영문·숫자·밑줄 4~20자</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">이메일</label>
                        <input type="email" class="form-control" id="email" name="email" autocomplete="email" value="user1@mycompany.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">비밀번호</label>
                        <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" value="12345" required>
                        <div class="form-text">영문과 숫자를 포함한 8~64자, 공백 제외</div>
                    </div>
                    <fieldset class="mb-3">
                        <legend class="fs-6 mb-2">취미 (1개 이상 선택)</legend>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="hobbyReading" name="hobby" value="reading">
                            <label for="hobbyReading" class="form-check-label">독서</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="hobbyExercise" name="hobby" value="exercise" checked>
                            <label for="hobbyExercise" class="form-check-label">운동</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="hobbyTravel" name="hobby" value="travel" checked>
                            <label for="hobbyTravel" class="form-check-label">여행</label>
                        </div>
                    </fieldset>
                    <div class="mb-3">
                        <label for="job" class="form-label">직업</label>
                        <select class="form-select" id="job" name="job" required>
                            <option value="" selected disabled>직업을 선택해 주세요.</option>
                            <option value="student" selected>학생</option>
                            <option value="employee">회사원</option>
                            <option value="self-employed">자영업자</option>
                            <option value="other">기타</option>
                        </select>
                    </div>
                    <fieldset class="mb-3">
                        <legend class="fs-6 mb-2">성별</legend>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="genderMale" name="gender" value="male" required checked>
                            <label for="genderMale" class="form-check-label">남성</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="genderFemale" name="gender" value="female" required>
                            <label for="genderFemale" class="form-check-label">여성</label>
                        </div>
                    </fieldset>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">제출</button>
                        <!-- <input type="submit" class="btn btn-primary" value="제출"/> -->

                        <button type="reset" class="btn btn-secondary">취소</button>
                    </div>
                </form>
                <div id="signupStatus" class="alert mt-3 mb-0" role="status" aria-live="polite" hidden></div>
            </div>
        </article>
    </main>
    <script>
        const form = document.getElementById('signupForm');

        async function requestSignup() {
            const formData = new FormData(form);
            const member = {
                userId: formData.get('userId'),
                email: formData.get('email'),
                password: formData.get('password'),
                hobbies: formData.getAll('hobby'),
                job: formData.get('job'),
                gender: formData.get('gender')
            };

            console.log(member);

            try {
                const response = await fetch("/api/method6", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Accept: 'text/plain'
                    },
                    body: JSON.stringify(member)
                });
                if (!response.ok) {
                    throw new Error(`요청에 실패했습니다. (HTTP ${response.status})`);
                }
                const result = await response.text();
                console.log(result);
            } catch (error) {
                console.error('API 호출 오류:', error);
            }
        }

        form.addEventListener('submit', event => {
            event.preventDefault();
            requestSignup();
        });
    </script>
</body>
</html>
