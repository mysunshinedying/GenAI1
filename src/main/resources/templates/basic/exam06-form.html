<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>/exam06-form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white text-body">
    <main class="container-fluid p-3 p-md-4">
        <article class="card shadow-sm rounded-3 overflow-hidden" aria-labelledby="request-title">
            <header class="card-header bg-body-tertiary p-3 p-md-4">
                <h1 id="request-title" class="fs-6 fw-normal mb-0">/exam06-form</h1>
            </header>
            <div class="card-body p-3 p-md-4">
                <p class="mb-0">회원 가입 양식</p>
                <form id="signupForm" class="mt-3" action="/api/members" method="post" novalidate>
                    <div class="mb-3">
                        <label for="userId" class="form-label">아이디</label>
                        <input type="text" class="form-control" id="userId" name="userId" autocomplete="username" required>
                        <div class="form-text">영문자로 시작하는 영문·숫자·밑줄 4~20자</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">이메일</label>
                        <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">비밀번호</label>
                        <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required>
                        <div class="form-text">영문과 숫자를 포함한 8~64자, 공백 제외</div>
                    </div>
                    <fieldset class="mb-3">
                        <legend class="fs-6 mb-2">취미 (1개 이상 선택)</legend>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="hobbyReading" name="hobby" value="reading">
                            <label for="hobbyReading" class="form-check-label">독서</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="hobbyExercise" name="hobby" value="exercise">
                            <label for="hobbyExercise" class="form-check-label">운동</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="hobbyTravel" name="hobby" value="travel">
                            <label for="hobbyTravel" class="form-check-label">여행</label>
                        </div>
                    </fieldset>
                    <div class="mb-3">
                        <label for="job" class="form-label">직업</label>
                        <select class="form-select" id="job" name="job" required>
                            <option value="" selected disabled>직업을 선택해 주세요.</option>
                            <option value="student">학생</option>
                            <option value="employee">회사원</option>
                            <option value="self-employed">자영업자</option>
                            <option value="other">기타</option>
                        </select>
                    </div>
                    <fieldset class="mb-3">
                        <legend class="fs-6 mb-2">성별</legend>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="genderMale" name="gender" value="male" required>
                            <label for="genderMale" class="form-check-label">남성</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="genderFemale" name="gender" value="female" required>
                            <label for="genderFemale" class="form-check-label">여성</label>
                        </div>
                    </fieldset>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">제출</button>
                        <!-- <input type="submit" class="btn btn-primary" value="제출"/> -->

                        <button type="reset" class="btn btn-secondary">취소</button>
                    </div>
                </form>
                <div id="signupStatus" class="alert mt-3 mb-0" role="status" aria-live="polite" hidden></div>
            </div>
        </article>
    </main>
    <script>
        const form = document.getElementById('signupForm');
        // 회원 가입 백엔드 API 주소입니다. 백엔드는 별도로 구현합니다.
        const signupApiUrl = form.action;
        const signupStatus = document.getElementById('signupStatus');
        const submitButton = form.querySelector('button[type="submit"]');
        const cancelButton = form.querySelector('button[type="reset"]');
        let sending = false;
        let submitted = false;

        function showStatus(message, type) {
            signupStatus.textContent = message;
            signupStatus.className = `alert alert-${type} mt-3 mb-0`;
            signupStatus.hidden = false;
        }
        const rules = [
            {
                name: 'userId',
                validate: ([input]) => /^[A-Za-z][A-Za-z0-9_]{3,19}$/.test(input.value),
                message: '아이디는 영문자로 시작하는 영문·숫자·밑줄 4~20자로 입력해 주세요.'
            },
            {
                name: 'email',
                validate: ([input]) => input.value.trim() !== '' && input.validity.valid && !/\s/.test(input.value),
                message: '올바른 이메일 주소를 입력해 주세요. 예: user@example.com'
            },
            {
                name: 'password',
                validate: ([input]) => /^(?=.*[A-Za-z])(?=.*[0-9])\S{8,64}$/.test(input.value),
                message: '비밀번호는 영문과 숫자를 포함해 공백 없이 8~64자로 입력해 주세요.'
            },
            {
                name: 'hobby',
                validate: inputs => inputs.some(input => input.checked),
                message: '취미를 1개 이상 선택해 주세요.'
            },
            {
                name: 'job',
                validate: ([input]) => ['student', 'employee', 'self-employed', 'other'].includes(input.value),
                message: '직업을 선택해 주세요.'
            },
            {
                name: 'gender',
                validate: inputs => inputs.some(input => input.checked),
                message: '성별을 선택해 주세요.'
            }
        ];

        rules.forEach(rule => {
            rule.inputs = Array.from(form.querySelectorAll(`[name="${rule.name}"]`));
            const feedback = document.createElement('div');
            feedback.id = `${rule.name}Error`;
            feedback.className = 'invalid-feedback';
            feedback.setAttribute('aria-live', 'polite');
            const container = rule.inputs[0].closest('fieldset') || rule.inputs[0].parentElement;
            container.append(feedback);
            rule.feedback = feedback;
            rule.inputs.forEach(input => input.setAttribute('aria-describedby', feedback.id));
        });

        function validateField(rule) {
            const valid = rule.validate(rule.inputs);
            rule.inputs.forEach(input => {
                input.classList.toggle('is-invalid', !valid);
                input.setAttribute('aria-invalid', String(!valid));
            });
            rule.feedback.textContent = valid ? '' : rule.message;
            rule.feedback.classList.toggle('d-block', !valid);
            return valid;
        }

        // 백엔드 통신: JSON 요청을 보내고 HTTP 상태와 응답 메시지를 처리합니다.
        // 요청: { userId, email, password, hobbies: [], job, gender }
        // 응답: 성공 시 2xx, 실패 시 4xx/5xx, 선택적으로 { message: "안내 문구" }
        async function requestSignup(member) {
            const response = await fetch(signupApiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Accept: 'application/json'
                },
                body: JSON.stringify(member)
            });
            let result = null;
            if (response.headers.get('content-type')?.includes('application/json')) {
                result = await response.json().catch(() => null);
            }
            const message = typeof result?.message === 'string' ? result.message : '';
            if (!response.ok) {
                throw new Error(message || `회원 가입 요청에 실패했습니다. (HTTP ${response.status})`);
            }
            return message || '회원 가입이 완료되었습니다.';
        }

        // 프론트엔드 처리: 검증 → 데이터 수집 → API 호출 → 화면 갱신
        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (sending) return;
            signupStatus.hidden = true;
            submitted = true;
            let firstInvalid;
            rules.forEach(rule => {
                if (!validateField(rule) && !firstInvalid) firstInvalid = rule.inputs[0];
            });
            if (firstInvalid) {
                firstInvalid.focus();
                return;
            }

            const data = new FormData(form);
            const member = {
                userId: data.get('userId'),
                email: data.get('email'),
                password: data.get('password'),
                hobbies: data.getAll('hobby'),
                job: data.get('job'),
                gender: data.get('gender')
            };

            sending = true;
            submitButton.disabled = true;
            cancelButton.disabled = true;
            form.setAttribute('aria-busy', 'true');
            showStatus('회원 가입 요청을 보내는 중입니다.', 'info');

            try {
                const message = await requestSignup(member);
                form.reset();
                showStatus(message, 'success');
            } catch (error) {
                const message = error instanceof TypeError
                    ? '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.'
                    : error.message;
                showStatus(message, 'danger');
            } finally {
                sending = false;
                submitButton.disabled = false;
                cancelButton.disabled = false;
                form.removeAttribute('aria-busy');
            }
        });

        function revalidate(event) {
            const rule = rules.find(rule => rule.name === event.target.name);
            if (rule && (submitted || event.type === 'focusout')) validateField(rule);
        }
        form.addEventListener('input', revalidate);
        form.addEventListener('change', revalidate);
        form.addEventListener('focusout', revalidate);
        form.addEventListener('reset', () => {
            submitted = false;
            signupStatus.hidden = true;
            signupStatus.textContent = '';
            rules.forEach(rule => {
                rule.inputs.forEach(input => {
                    input.classList.remove('is-invalid');
                    input.removeAttribute('aria-invalid');
                });
                rule.feedback.textContent = '';
                rule.feedback.classList.remove('d-block');
            });
        });
    </script>
</body>
</html>
