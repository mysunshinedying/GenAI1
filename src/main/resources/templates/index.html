<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MY COMPANY | 회사 안내</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Bootstrap에 없는 고정 사이드바 너비와 콘텐츠 최소 크기만 정의합니다. */
        .sidebar { width: 250px; }
        .content-panel { min-width: 0; }
        .content-frame { min-height: 0; }
        @media (max-width: 575.98px) {
            .sidebar { width: 135px; }
        }
    </style>
</head>
<body class="bg-white text-body d-flex flex-column min-vh-100">
    <header class="d-flex align-items-center px-3 px-md-4 py-3 bg-black text-white">
        <a class="text-white text-decoration-none fw-bold d-flex align-items-center gap-2" href="/" aria-label="MY COMPANY 홈">
            <span class="d-inline-flex align-items-center justify-content-center bg-white text-black rounded px-2 py-1" aria-hidden="true">M</span>
            MY COMPANY
        </a>
        <span class="d-none d-sm-inline ms-auto small text-white-50">함께 만드는 더 나은 내일</span>
    </header>

    <div class="d-flex flex-grow-1">
        <aside class="sidebar flex-shrink-0 bg-white border-end d-flex flex-column p-2 p-md-3" aria-label="회사 안내 메뉴">
            <p class="small text-secondary fw-semibold px-2 mt-3 mb-3">기본</p>
            <nav class="nav nav-pills flex-column gap-1" id="company-menu" aria-label="기본 메뉴">
                <button class="nav-link text-start text-break rounded px-2 px-sm-3 py-2" type="button">/exam01-variables</button>
                <button class="nav-link text-start text-break rounded px-2 px-sm-3 py-2" type="button">/exam02-function</button>
                <button class="nav-link text-start text-break rounded px-2 px-sm-3 py-2" type="button">/exam03-object</button>
                <button class="nav-link text-start text-break rounded px-2 px-sm-3 py-2" type="button">/exam04-array</button>
                <button class="nav-link text-start text-break rounded px-2 px-sm-3 py-2" type="button">/exam05-dom</button>
                <button class="nav-link text-start text-break rounded px-2 px-sm-3 py-2" type="button">/exam06-form</button>
                <button class="nav-link text-start text-break rounded px-2 px-sm-3 py-2" type="button">/exam07-fetch</button>
            </nav>
            <div class="mt-auto pt-5 px-2 small text-secondary">MY COMPANY<br><span class="small">Company Information</span></div>
        </aside>

        <main class="content-panel flex-grow-1 bg-white">
            <div class="w-100">
                <div id="company-content" aria-busy="false">
                    <p id="request-status" class="text-secondary" role="status" aria-live="polite">메뉴를 선택해 주세요.</p>
                    <iframe id="content-frame" title="선택한 메뉴 내용" class="content-frame w-100 border-0 rounded bg-white" hidden></iframe>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const menu = document.getElementById('company-menu');
        const content = document.getElementById('company-content');
        const frame = document.getElementById('content-frame');
        const status = document.getElementById('request-status');
        let currentRequest;
        let frameObserver;

        // srcdoc 문서는 같은 출처이므로 내용 높이에 맞춰 iframe 높이를 조절합니다.
        frame.addEventListener('load', () => {
            frameObserver?.disconnect();
            const doc = frame.contentDocument;
            if (!doc) return;
            const resize = () => { frame.style.height = doc.documentElement.offsetHeight + 'px'; };
            resize();
            frameObserver = new ResizeObserver(resize);
            frameObserver.observe(doc.documentElement);
        });

        async function loadMenu(button) {
            currentRequest?.abort();
            const request = new AbortController();
            currentRequest = request;
            const name = button.textContent.trim();
            const path = name.startsWith('/') ? name : '/' + name;

            menu.querySelectorAll('button').forEach(item => {
                const selected = item === button;
                item.classList.toggle('active', selected);
                if (selected) item.setAttribute('aria-current', 'true');
                else item.removeAttribute('aria-current');
            });
            content.setAttribute('aria-busy', 'true');
            frame.hidden = true;
            status.hidden = false;
            status.className = 'text-secondary';
            status.textContent = name + ' 내용을 불러오는 중입니다.';

            try {
                const response = await fetch(path, {
                    signal: request.signal,
                    headers: { Accept: 'text/html' }
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const html = await response.text();
                if (request.signal.aborted) return;

                // 별도 문서로 표시하여 예제의 스타일과 스크립트도 동작하게 합니다.
                const documentContent = new DOMParser().parseFromString(html, 'text/html');
                if (!documentContent.querySelector('base')) {
                    const base = documentContent.createElement('base');
                    base.href = response.url;
                    documentContent.head.prepend(base);
                }
                frame.title = name + ' 내용';
                frame.srcdoc = '<!doctype html>' + documentContent.documentElement.outerHTML;
                frame.hidden = false;
                status.textContent = name + ' 내용을 불러왔습니다.';
                status.className = 'visually-hidden';
            } catch (error) {
                if (request.signal.aborted) return;
                status.className = 'alert alert-danger';
                status.textContent = path + ' 요청에 실패했습니다. (' + error.message + ')';
            } finally {
                if (currentRequest === request) content.setAttribute('aria-busy', 'false');
            }
        }

        menu.addEventListener('click', event => {
            const button = event.target.closest('button');
            if (button && menu.contains(button)) loadMenu(button);
        });
        loadMenu(menu.querySelector('button'));
    </script>
</body>
</html>
